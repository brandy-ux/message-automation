name: Form Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run automation
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          SUBMISSION_LINK: ${{ secrets.SUBMISSION_LINK }}
          # Do NOT add TEXTBOX_SELECTOR or SUBMIT_SELECTOR unless auto-detection
          # cannot find the controls on the target page.
          COOLDOWN_SECONDS: "1920"
        run: python bot.py

      - name: Upload automation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: automation-diagnostics
          path: |
            automation-error.png
            automation-error.html
          if-no-files-found: ignore
